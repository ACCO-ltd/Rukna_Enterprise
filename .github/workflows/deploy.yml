name: Deploy

# Auto-deploy to the Contabo VPS — the self-hosted equivalent of Vercel's git auto-deploy.
#
# Fires after the "CI" workflow finishes on `main`; the deploy job runs ONLY when that CI
# run succeeded (so a red build never ships). Also exposes a manual "Run workflow" button
# (workflow_dispatch) as a backup / on-demand deploy.
#
# The box runs deploy/deploy.sh: it backs up both databases (keeps the newest 14), PULLS the new
# code, rebuilds its own images (rukna_api + rukna_web) behind the shared Caddy, fails the run if the
# migrations or the health checks fail. SIMAD/TConnect are untouched — only Rukna's compose project.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — private half of an SSH key whose public half is in the VPS deploy
#                     user's ~/.ssh/authorized_keys (whole file incl. BEGIN/END lines)
#   DEPLOY_HOST     — 169.58.180.80
#   DEPLOY_USER     — deploy
#   DEPLOY_KNOWN_HOSTS (optional) — the VPS host key line(s) from `ssh-keyscan 169.58.180.80`;
#                     pins the server's identity instead of trusting the first key seen
#
# Note: the VPS `git fetch` authenticates to GitHub with the credential stored on the box
# (credential.helper store / a PAT). If that credential is revoked, auto-deploy's fetch
# fails until the box has a valid one again.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    # Manual runs always deploy; auto (workflow_run) runs only when CI succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # A cold rebuild of both images takes ~9 minutes on the box; leave room for the backup + health wait.
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ]; then
            echo "::error::Missing DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER secret(s). Add them in repo Settings → Secrets → Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Prefer the pinned host key (secret DEPLOY_KNOWN_HOSTS = output of `ssh-keyscan <host>` run
          # once from a trusted machine); without it, fall back to trusting the key seen right now.
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # deploy/deploy.sh does backup → pull → rebuild → migration check → health check, and fails
          # on the first problem. Take the script from the new main first, so a fix to the script
          # itself applies to this very deploy; the script then brings the whole checkout to main.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -seuo pipefail' <<'REMOTE'
          cd ~/Rukna_Enterprise
          git fetch origin main
          git checkout origin/main -- deploy/deploy.sh
          bash deploy/deploy.sh
          REMOTE

# ─────────────────────────────────────────────────────────────────────────────
# Rukna — PRODUCTION stack for a SHARED Contabo VPS.
#
# This box already runs other products behind a single shared Caddy
# (deploy-caddy-1, config /opt/simad/deploy/Caddyfile, network deploy_internal)
# that owns ports 80/443. So Rukna does NOT run its own Caddy — it attaches its
# api + minio to that shared network, and two site blocks are added to the shared
# Caddyfile (api.rukna.site → rukna_api:3001, storage.rukna.site → rukna_minio:9000),
# exactly how the tconnect-* containers are wired.
#
#   caddy      → the EXISTING shared deploy-caddy-1 (NOT started here)
#   api        → NestJS backend (internal :3001, reached by the shared Caddy)
#   migrate    → one-shot: applies platform + tenant migrations before api starts
#   postgres   → platform + ACCO tenant DBs (internal only)
#   minio      → S3 storage (reached by api and by the shared Caddy)
#   minio-init → one-shot: creates the file bucket
#
# Secrets: deploy/.env (compose) + apps/api/.env (app). The DB password must match.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

# CRITICAL on a shared box: pin the project name. Without this, Compose derives it
# from the parent directory ("deploy"), which collides with the SIMAD stack at
# /opt/simad/deploy (also project "deploy") and would adopt/replace its containers.
name: rukna

services:
  postgres:
    image: postgres:16-alpine
    container_name: rukna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: rukna_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rukna_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d rukna_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rukna_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in deploy/.env}
    volumes:
      - minio_data:/data
    networks:
      - rukna_internal # ONLY internal — not exposed to the shared proxy or the host
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - rukna_internal
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-rukna-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/$${FILE_STORAGE_BUCKET} &&
      echo 'bucket ready: '$${FILE_STORAGE_BUCKET}
      "
    restart: 'no'

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rukna-api:latest
    env_file: ../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rukna_internal
    command: ['pnpm', 'db:migrate:deploy']
    restart: 'no'

  # Service name is deliberately UNIQUE (not "api"): the container joins the shared
  # deploy_internal network, where Compose would otherwise register the service name
  # as a network alias — and SIMAD already owns the alias "api" there, so a generic
  # name would hijack SIMAD's `reverse_proxy api:3000`. As `rukna_api` the only alias
  # it adds on the shared network is `rukna_api`.
  rukna_api:
    image: rukna-api:latest
    container_name: rukna_api
    restart: unless-stopped
    env_file: ../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - rukna_internal # reaches postgres + minio
      - deploy_internal # secondary attachment so the existing shared Caddy can reach api.rukna.site
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Next.js web app. Unique service name (not "web") for the same shared-network
  # alias reason as rukna_api. Only on deploy_internal so the shared Caddy can reach
  # it (acco.rukna.site → rukna_web:3000); it calls the API over the public URL baked
  # at build time (NEXT_PUBLIC_API_URL), so it needs no DB/MinIO network.
  rukna_web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.rukna.site/api/v1
    image: rukna-web:latest
    container_name: rukna_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - deploy_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  rukna_internal:
    name: rukna_internal # explicit, so it is not prefixed to rukna_rukna_internal
    driver: bridge
  # The shared reverse-proxy network created by /opt/simad/deploy (deploy-caddy-1).
  # Only the api service attaches here (secondary), so the existing Caddy can reach it.
  # NOTE: minio is intentionally NOT on this network, so storage.rukna.site is not proxied
  # and browser file uploads are deferred until MinIO is deliberately exposed later.
  deploy_internal:
    external: true

volumes:
  postgres_data:
    name: rukna_postgres_data
    driver: local
  minio_data:
    name: rukna_minio_data
    driver: local
